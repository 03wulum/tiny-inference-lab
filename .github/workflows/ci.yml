name: ci
on: [push, pull_request]
jobs:
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          for f in experiments/*/requirements.txt; do pip install -r "$f"; done
      - name: Tests
        run: |
          for d in experiments/*/; do (cd "$d" && python -m pytest -q); done
      - name: Smoke-run every experiment (quick)
        run: |
          python run_all.py --quick
